<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chyba</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 40px 20px;
        }

        .box {
            background: white;
            border: 1px solid #ccc;
            padding: 25px;
            max-width: 420px;
            margin: 0 auto;
        }

        h1 {
            margin-top: 0;
            font-size: 20px;
            color: #c00;
        }

        p {
            font-size: 14px;
            color: #333;
            margin-bottom: 20px;
        }

        a {
            padding: 7px 15px;
            background: #333;
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        a:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Chyba</h1>
        <p>{{ error }}</p>
        <a href="{{ url_for('login') }}">Zpět na přihlášení</a>
    </div>
</body>
</html>
